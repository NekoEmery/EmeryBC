<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Ears — drawn first so the face rect overlaps their base naturally -->
  <polygon points="12,42 25,4 42,36" fill="#cf6f98"/>
  <polygon points="48,36 65,4 78,42" fill="#cf6f98"/>
  <!-- Inner ear -->
  <polygon points="17,39 26,12 39,35" fill="#4a1828"/>
  <polygon points="51,35 64,12 73,39" fill="#4a1828"/>
  <!-- Face -->
  <rect x="8" y="22" width="74" height="62" rx="18" fill="#2a1421" stroke="#cf6f98" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="31" cy="47" r="8" fill="#f7e6ee"/>
  <circle cx="59" cy="47" r="8" fill="#f7e6ee"/>
  <!-- Pupils -->
  <ellipse cx="31" cy="47" rx="3.5" ry="6" fill="#190b13"/>
  <ellipse cx="59" cy="47" rx="3.5" ry="6" fill="#190b13"/>
  <!-- Nose -->
  <path d="M42 58 L45 55 L48 58 Z" fill="#cf6f98"/>
  <!-- Smile -->
  <path d="M38 62 Q45 70 52 62" stroke="#f7e6ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
