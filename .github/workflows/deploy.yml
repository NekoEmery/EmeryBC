name: Build & Deploy

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "name=stable" >> $GITHUB_OUTPUT
            echo "prod=true"  >> $GITHUB_OUTPUT
          else
            echo "name=dev"   >> $GITHUB_OUTPUT
            echo "prod=false" >> $GITHUB_OUTPUT
          fi

      - name: Patch IS_DEV_BUILD for production
        if: steps.channel.outputs.prod == 'true'
        run: sed -i 's/const IS_DEV_BUILD = true/const IS_DEV_BUILD = false/' src/main.ts

      - name: Build
        run: |
          if [ "${{ steps.channel.outputs.prod }}" = "true" ]; then
            npm run build:prod
          else
            npm run build
          fi

      - name: Assemble deploy folder
        run: |
          mkdir -p deploy/${{ steps.channel.outputs.name }}
          cp -r dist/. deploy/${{ steps.channel.outputs.name }}/
          cp -r public/. deploy/

      - name: Get commit subject
        id: commitmsg
        # Use only the first line (subject) of the commit message so the
        # multi-line body never ends up unquoted inside the git commit command,
        # which caused the deploy to treat body words as pathspec arguments.
        run: echo "title=$(git log -1 --format=%s)" >> $GITHUB_OUTPUT

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: deploy
          clean: false
          commit-message: "deploy(${{ steps.channel.outputs.name }}): ${{ steps.commitmsg.outputs.title }}"
